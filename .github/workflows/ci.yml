name: CI

on:
  push: {branches: [main]}
  pull_request:

# Read-only is all any job here needs. The default token is broader.
permissions:
  contents: read

# A new push supersedes the run it interrupted; the old one has nothing left to tell us.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Guards (Tier D, secrets, migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # No install step: tier_d_scan.py is stdlib only, on purpose.
      - name: Tier D scan
        run: python scripts/tier_d_scan.py
      - name: No committed .env
        # Anchored at any path segment, not at the repository root. `^\.env` matched `.env.dev` and
        # let `services/foo/.env` and `frontend/.env.local` straight through — and since the sync to
        # the shared `startup` repository publishes the whole tree, .gitignore plus this check are
        # the only two things keeping a credential out of another account's repository.
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "Committed env files:" >&2
            echo "$leaked" >&2
            exit 1
          fi
          echo "no .env files committed"
      - name: Single migration head
        # One history, sequentially numbered (`.claude/skills/db-migration`). Two people numbering
        # `000N` on the same day forks it, and nothing else in this pipeline would notice: the
        # services never run `upgrade head` here. `alembic heads` reads the version scripts and
        # needs no database.
        run: |
          pip install -e ./shared
          heads=$(cd shared && python -m alembic heads | grep -c '(head)')
          if [ "$heads" != "1" ]; then
            echo "expected exactly one migration head, found $heads:" >&2
            (cd shared && python -m alembic heads) >&2
            exit 1
          fi
          echo "one migration head"

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: shared/pyproject.toml}
      # ruff and mypy are pinned exactly in shared/pyproject.toml. They were `>=`, and this job was
      # red on every run from 2026-08-21 to 2026-08-25 without a single real defect behind it —
      # a formatter that updates itself is not a gate, it is a coin toss.
      - run: pip install -e ./shared[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy shared/regops_shared --ignore-missing-imports

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: shared/pyproject.toml}
      - run: pip install -e ./shared[dev]
      # The whole gate CLAUDE.md names, not a subset of it. This ran `services/regulation` alone
      # while the comment said "service unit suites" in the plural — written when regulation was the
      # only service with tests, and never grown. It left 203 of 671 tests unrun: assistant (85),
      # monitoring (30), evaluation (52), fda_lag (36). Every one of them passes with nothing
      # installed but `shared[dev]`, so the exclusion bought nothing and hid the assistant service
      # entirely.
      #
      # The integration suites need the compose stack and stay a local/stage gate.
      - run: python -m pytest shared/tests -q
      - run: python -m pytest services/*/tests/unit -q
      - run: python -m pytest scripts/evaluation/tests scripts/fda_lag/tests -q

  frontend:
    name: Frontend typecheck & lint
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      # `npm ci`, not `npm install`: it installs the lockfile exactly and fails if the lockfile and
      # package.json disagree, where `install` would quietly resolve something newer and rewrite the
      # lock. Same reason the Python linters are pinned.
      - run: npm ci
      # The phase 0 deferral ("no frontend yet"), now that there is one. phase1.5's acceptance
      # asserts a clean typecheck, so the gate has to exist rather than just the command.
      - run: npm run typecheck
      - run: npm run lint
      # `npm run e2e` is deliberately absent. Playwright drives the running compose stack against
      # the real corpus and a live model: minutes per answer, worded differently every run, so a red
      # build here would as often mean "the model was slow" as "the product broke". It runs where
      # the integration suites run — locally and against a stage stack, before a phase is called
      # done (phase1.5 deviation 17).
