name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  guards:
    name: Guards (Tier D, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Tier D scan
        run: python scripts/tier_d_scan.py
      - name: No committed .env
        run: |
          leaked=$(git ls-files | grep -E '^\.env' | grep -v '^\.env\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "Committed env files: $leaked" >&2
            exit 1
          fi
          echo "no .env files committed"

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ./shared[dev]
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy shared/regops_shared --ignore-missing-imports

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ./shared[dev]
      - run: python -m pytest shared/tests -q
      # Service unit suites are mock-only (no DB, no network), so they belong in CI. The
      # integration suites need the compose stack and stay a local/stage gate.
      - run: python -m pytest services/regulation/tests/unit -q

  frontend:
    name: Frontend typecheck & lint
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install
      # The phase 0 deferral ("no frontend yet"), now that there is one. phase1.5's acceptance
      # asserts a clean typecheck, so the gate has to exist rather than just the command.
      - run: npm run typecheck
      - run: npm run lint
