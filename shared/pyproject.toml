[project]
name = "regops-shared"
version = "0.1.0"
description = "Shared contracts for RegOps services — models, auth, LLM seam, audit writer"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    # Alembic runs sync; services run async. Both drivers are needed.
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13",
    # The `vector` column type and its SQLAlchemy binding. The extension itself ships with the
    # database image (docker-compose `db`), which is why that image is pgvector's and not stock
    # postgres — see migration 0005.
    "pgvector>=0.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "minio>=7.2",
    "structlog>=24.4",
    "httpx>=0.27",
    # Connector responses are XML from external hosts; stdlib ElementTree is XXE-exposed.
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # **The linters are pinned exactly, and that is the point.** They were `>=`, so CI installed
    # whatever shipped that morning while developers ran whatever they installed months ago — and a
    # linter is the one tool that fails a build on code nobody touched. CI was red for every run
    # from 2026-08-21 to 2026-08-25, never once for a real defect: first `ruff format` changed how
    # it wrapped a conditional inside a `key=lambda`, then `RUF059` arrived and flagged an unpacked
    # variable in a test written days earlier. Locally ruff was 0.12.10 against CI's 0.16.4.
    #
    # Bumping these is now a deliberate commit that shows the diff it causes, which is the only way
    # a formatter can be a gate at all.
    "ruff==0.16.4",
    "mypy==1.13.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regops_shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
