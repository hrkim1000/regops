[project]
name = "regops-shared"
version = "0.1.0"
description = "Shared contracts for RegOps services — models, auth, LLM seam, audit writer"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    # Alembic runs sync; services run async. Both drivers are needed.
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "celery[redis]>=5.4",
    "redis>=5.1",
    "minio>=7.2",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regops_shared*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
