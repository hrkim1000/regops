# RegOps development stack.
#
# Credentials below are LOCAL DEV DEFAULTS, overridable from .env.<STAGE>. They are not secrets
# and must not be reused outside a developer machine.
#
# Ports are in the 2xxxx block so this runs alongside other local stacks without collision.
# Ollama is deliberately NOT namespaced — one host-native instance is shared.
#
#   infra      postgres 25432 · redis 26379 · minio 29000/29001 · pgadmin 25051 · flower 25555
#   services   platform-core 28000 · regulation 28001 · monitoring 28002 · assistant 28003
#   frontend   23000

x-service-base: &service-base
  env_file:
    - ".env.${STAGE:-dev}"
  environment:
    DATABASE_URL: postgresql+asyncpg://regops_app:${REGOPS_APP_DB_PASSWORD:-regops-app}@db:5432/regops
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
  volumes:
    - ./shared:/shared
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  # --- infrastructure ------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regops}
      POSTGRES_DB: regops
      REGOPS_APP_DB_PASSWORD: ${REGOPS_APP_DB_PASSWORD:-regops-app}
    ports: ["25432:5432"]
    volumes:
      - "regops_pgdata:/var/lib/postgresql/data"
      - "./infra/postgres/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regops -d regops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["26379:6379"]
    volumes: ["regops_redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: regops
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-regops-secret}
    ports: ["29000:9000", "29001:9001"]
    volumes: ["regops_miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports: ["25051:80"]
    volumes: ["regops_pgadmindata:/var/lib/pgadmin"]
    depends_on: [db]

  flower:
    image: mher/flower:latest
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports: ["25555:5555"]
    depends_on: [redis]

  # --- migrations (one-shot) ----------------------------------------------
  migrate:
    build: {context: ., dockerfile: services/platform-core/Dockerfile}
    env_file:
    - ".env.${STAGE:-dev}"
    environment:
      DATABASE_URL: postgresql+asyncpg://regops:regops@db:5432/regops
    working_dir: /shared
    command: alembic upgrade head
    volumes: ["./shared:/shared"]
    depends_on:
      db: {condition: service_healthy}
    profiles: [app, migrate]
    restart: "no"

  # --- application services ------------------------------------------------
  platform-core:
    <<: *service-base
    build: {context: ., dockerfile: services/platform-core/Dockerfile}
    ports: ["28000:8000"]
    volumes:
      - ./shared:/shared
      - ./services/platform-core:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: [app]

  regulation:
    <<: *service-base
    build: {context: ., dockerfile: services/regulation/Dockerfile}
    ports: ["28001:8000"]
    volumes:
      - ./shared:/shared
      - ./services/regulation:/app
    profiles: [app]

  monitoring:
    <<: *service-base
    build: {context: ., dockerfile: services/monitoring/Dockerfile}
    ports: ["28002:8000"]
    volumes:
      - ./shared:/shared
      - ./services/monitoring:/app
    profiles: [app]

  assistant:
    <<: *service-base
    build: {context: ., dockerfile: services/assistant/Dockerfile}
    ports: ["28003:8000"]
    volumes:
      - ./shared:/shared
      - ./services/assistant:/app
    profiles: [app]

  # --- optional: Ollama inside Docker -------------------------------------
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["regops_ollama:/root/.ollama"]
    profiles: [local-llm]

volumes:
  regops_pgdata:
  regops_redisdata:
  regops_miniodata:
  regops_pgadmindata:
  regops_ollama:
