# RegOps development stack.
#
# Credentials below are LOCAL DEV DEFAULTS, overridable from .env.<STAGE>. They are not secrets
# and must not be reused outside a developer machine.
#
# Ports are in the 2xxxx block so this runs alongside other local stacks without collision.
# Ollama is deliberately NOT namespaced — one host-native instance is shared.
#
#   infra      postgres 25432 · redis 26379 · minio 29000/29001 · pgadmin 25051 · flower 25555
#   services   platform-core 28000 · regulation 28001 · monitoring 28002 · assistant 28003
#   frontend   23000

# `environment:` WINS OVER `env_file:` in Compose. The keys below are therefore fixed by the
# compose topology and cannot be changed from `.env.<STAGE>` — a DATABASE_URL set there is silently
# ignored. That is deliberate: every one of them names something defined in *this* file, so letting
# a stage file half-override it produces a mismatch that only shows up at first use.
#
# Everything NOT listed here (JWT_SECRET, LLM_*, LAW_GO_KR_OC, …) does come from the stage file,
# which is what makes `.env.test` useful: a test stage with a blank LAW_GO_KR_OC cannot reach
# law.go.kr at all.
#
# The database name is the one part a test run must change, so it gets its own knob rather than
# fighting that precedence:
#
#   STAGE=test REGOPS_DB_NAME=regops_test docker compose run --rm regulation \
#       python -m pytest tests/integration -q
x-service-base: &service-base
  env_file:
    - ".env.${STAGE:-dev}"
  environment:
    DATABASE_URL: postgresql+asyncpg://regops_app:${REGOPS_APP_DB_PASSWORD:-regops-app}@db:5432/${REGOPS_DB_NAME:-regops}
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: minio:9000
    # Pinned here, not left to the stage file: the MinIO *server* below reads these same
    # host-interpolated values, so a stage file setting only the client half produces a
    # SignatureDoesNotMatch at the first archive write rather than at startup.
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-regops}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-regops-secret}
  volumes:
    - ./shared:/shared
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  # --- infrastructure ------------------------------------------------------
  # pgvector's image, not stock postgres: phase 1.3 stores 768-dim clause embeddings with an HNSW
  # cosine index, and `CREATE EXTENSION vector` needs the extension present in the image. Same
  # PostgreSQL major version as the postgres:16-alpine it replaces, so the existing data directory
  # is read as-is — but it is Debian/glibc where that was Alpine/musl, and glibc collates text
  # differently. Migration 0005 REINDEXes the text indexes for exactly that reason.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: regops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regops}
      POSTGRES_DB: regops
      REGOPS_APP_DB_PASSWORD: ${REGOPS_APP_DB_PASSWORD:-regops-app}
    ports: ["25432:5432"]
    volumes:
      - "regops_pgdata:/var/lib/postgresql/data"
      - "./infra/postgres/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regops -d regops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["26379:6379"]
    volumes: ["regops_redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Same two variables the services read — one source, so they cannot drift apart.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-regops}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-regops-secret}
    ports: ["29000:9000", "29001:9001"]
    volumes: ["regops_miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      # Pre-registers the three connections so nobody has to rediscover that the host is `db`
      # rather than `localhost` — pgAdmin is inside this network and cannot see the host mapping.
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports: ["25051:80"]
    volumes:
      - "regops_pgadmindata:/var/lib/pgadmin"
      - "./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro"
    depends_on: [db]

  flower:
    image: mher/flower:latest
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports: ["25555:5555"]
    depends_on: [redis]

  # --- migrations (one-shot) ----------------------------------------------
  migrate:
    build: {context: ., dockerfile: services/platform-core/Dockerfile}
    env_file:
    - ".env.${STAGE:-dev}"
    environment:
      # Same `REGOPS_DB_NAME` knob the services use, so the documented
      # `REGOPS_DB_NAME=regops_test docker compose run --rm migrate` actually reaches the test
      # database instead of silently re-migrating the dev one.
      DATABASE_URL: postgresql+asyncpg://regops:regops@db:5432/${REGOPS_DB_NAME:-regops}
    working_dir: /shared
    command: alembic upgrade head
    volumes: ["./shared:/shared"]
    depends_on:
      db: {condition: service_healthy}
    profiles: [app, migrate]
    restart: "no"

  # --- application services ------------------------------------------------
  platform-core:
    <<: *service-base
    build: {context: ., dockerfile: services/platform-core/Dockerfile}
    ports: ["28000:8000"]
    volumes:
      - ./shared:/shared
      - ./services/platform-core:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: [app]

  regulation:
    <<: *service-base
    build: {context: ., dockerfile: services/regulation/Dockerfile}
    ports: ["28001:8000"]
    volumes:
      - ./shared:/shared
      - ./services/regulation:/app
      - ./scripts:/scripts
    profiles: [app]

  # The ingestion chain runs here: fetch -> archive -> version, committing incrementally so a
  # retry skips completed rows. Concurrency stays low on purpose — these are government hosts.
  regulation-worker:
    <<: *service-base
    build: {context: ., dockerfile: services/regulation/Dockerfile}
    command: celery -A app.celery_app.celery_app worker -Q regulation -c 2 -l info
    volumes:
      - ./shared:/shared
      - ./services/regulation:/app
      - ./scripts:/scripts
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    profiles: [app]

  # Beat lives with `regulation`: it drives source_schedules and has no other consumer.
  regulation-beat:
    <<: *service-base
    build: {context: ., dockerfile: services/regulation/Dockerfile}
    command: celery -A app.celery_app.celery_app beat -l info
    volumes:
      - ./shared:/shared
      - ./services/regulation:/app
    profiles: [app]

  monitoring:
    <<: *service-base
    build: {context: ., dockerfile: services/monitoring/Dockerfile}
    ports: ["28002:8000"]
    volumes:
      - ./shared:/shared
      - ./services/monitoring:/app
    profiles: [app]

  assistant:
    <<: *service-base
    build: {context: ., dockerfile: services/assistant/Dockerfile}
    ports: ["28003:8000"]
    volumes:
      - ./shared:/shared
      - ./services/assistant:/app
    profiles: [app]

  # Embedding a version and answering a question are both long, model-bound work, so both run off
  # the API process. Concurrency 2, matching the regulation worker: Ollama is one shared host-native
  # instance and queueing there is cheaper than thrashing it.
  assistant-worker:
    <<: *service-base
    build: {context: ., dockerfile: services/assistant/Dockerfile}
    command: celery -A app.celery_app.celery_app worker -Q assistant -c 2 -l info
    volumes:
      - ./shared:/shared
      - ./services/assistant:/app
    profiles: [app]

  # --- frontend ------------------------------------------------------------
  #
  # Reaches the services by compose service name; the browser only ever sees this origin, so the
  # JWT cookie stays first-party and no service is exposed to it directly.
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["23000:3000"]
    environment:
      PLATFORM_CORE_URL: http://platform-core:8000
      REGULATION_URL: http://regulation:8000
      MONITORING_URL: http://monitoring:8000
      ASSISTANT_URL: http://assistant:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/next.config.mjs:/app/next.config.mjs
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
    depends_on:
      platform-core: {condition: service_healthy}
    profiles: [app]
    restart: unless-stopped

  # --- optional: Ollama inside Docker -------------------------------------
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["regops_ollama:/root/.ollama"]
    profiles: [local-llm]

volumes:
  regops_pgdata:
  regops_redisdata:
  regops_miniodata:
  regops_pgadmindata:
  regops_ollama:
