line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[lint.per-file-ignores]
"shared/alembic/versions/*" = ["E501"]
"**/tests/*" = ["S101"]

[lint.isort]
known-first-party = ["regops_shared", "app"]
